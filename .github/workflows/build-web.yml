# Run the tests, build the web app at web/_site/, and deploy it to GitHub
# Pages on every push to main.

name: build-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version that made tests/refs/.
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-dependency-glob: assets/fonts/fetch.sh

      - name: Fetch fonts
        run: ./assets/fonts/fetch.sh

      - name: Run tests
        run: ./tests/run.sh

      - name: Build web/_site/
        run: ./web/build.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
